# ===================================================================
# CẤU HÌNH HỆ THỐNG CỐT LÕI (CHỢ HỜI API)
# ===================================================================
spring.application.name=cho-hoi-api
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Tự động nạp file cấu hình môi trường bên ngoài nếu có
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# ===================================================================
# CẤU HÌNH KẾT NỐI DATABASE (NEON CLOUD POSTGRESQL)
# ===================================================================
# Trỏ mặc định thẳng lên Cloud Neon. Nếu ở local có file .env đè lên (DB_URL) thì sẽ ăn theo local.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-solitary-hill-a1iddt17.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_W1iaPvbL7dBh}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình Pool kết nối dữ liệu
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ===================================================================
# CẤU HÌNH ORM HIBERNATE / JPA
# ===================================================================
# Đổi từ 'validate' thành 'update' ở giai đoạn phát triển đồ án để Hibernate tự tạo/sửa bảng từ code Java
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Giải quyết triệt để lỗi lệch 7 tiếng của cơ sở dữ liệu Cloud quốc tế
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Tắt Flyway tạm thời (Đặt false) vì chúng ta đang dùng ddl-auto=update để Hibernate tự sinh bảng tự động,
# tránh việc Flyway quét lỗi conflict script tạo bảng ở giai đoạn đầu.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# ===================================================================
# CẤU HÌNH BẢO MẬT & JWT TOKEN / CORS
# ===================================================================
app.jwt.secret=${JWT_SECRET:chuoi_bi_mat_mac_dinh_cho_do_an_cho_hoi_2026_super_secure_key}
app.jwt.secret-base64=${JWT_SECRET_BASE64:false}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Cấu hình tài khoản Admin tối cao nội bộ
app.admin.email=${ADMIN_EMAIL:admin@chohoi.vn}
app.admin.password=${ADMIN_PASSWORD:AdminChoHoi2026@}

# Mở cổng CORS cấp quyền cho giao diện React/Vue ở Frontend kết nối vào API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}